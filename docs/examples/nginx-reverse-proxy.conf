# nginx as HTTPS reverse proxy in front of the What2Bring container
# (docker compose publishes it on 127.0.0.1:8470).
#
# What2Bring must trust this proxy, otherwise it ignores X-Forwarded-*:
#   W2B_TRUSTED_PROXIES=<IP the container sees for nginx>
#   - nginx on the Docker host, port published on 127.0.0.1: usually the bridge
#     gateway, e.g. 172.17.0.1 or 172.16.0.0/12
#   - nginx in the same compose network: that network's subnet
server {
    listen 443 ssl;
    http2 on;
    server_name events.example.org;

    ssl_certificate     /etc/letsencrypt/live/events.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.example.org/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8470;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, do not append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

server {
    listen 80;
    server_name events.example.org;
    return 301 https://$host$request_uri;
}
