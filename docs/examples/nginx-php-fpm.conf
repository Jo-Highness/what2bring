# What2Bring served directly by nginx + PHP-FPM (no Apache, so no .htaccess).
# The document root MUST be the public/ directory; everything else
# (config.php, data/, inc/, templates/ ...) stays outside of it.
server {
    listen 443 ssl;
    http2 on;
    server_name events.example.org;

    ssl_certificate     /etc/letsencrypt/live/events.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.example.org/privkey.pem;

    root /var/www/what2bring/public;   # <-- public/, not the project root
    index index.php;

    client_max_body_size 2m;
    server_tokens off;

    # Never serve dotfiles (.htaccess, .git, ...) — and, defensively, private dirs
    # in case the root is ever pointed at the project directory by mistake.
    location ~ /\.(?!well-known/) { deny all; return 404; }
    location ~ ^/(data|inc|templates|docs|bin|tests|docker)(/|$) { deny all; return 404; }
    location ~ (config\.php|schema\.sql|\.sqlite[^/]*)$ { deny all; return 404; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Any other .php file is not part of the public interface.
    location ~ \.php$ { return 404; }

    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800";
    }
}

server {
    listen 80;
    server_name events.example.org;
    return 301 https://$host$request_uri;
}
